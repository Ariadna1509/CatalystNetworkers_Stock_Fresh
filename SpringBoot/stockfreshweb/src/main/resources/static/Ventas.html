<div class="vta">
  <h1 class="vta-title">Registro de Ventas</h1>
  <p class="vta-subtitle">Elige qué quieres hacer con tus ventas</p>

  <div class="vta-cards"> 

    <!-- Registrar venta -->
    <div class="vta-card">
      <button class="vta-btn vta-btn-green" onclick="RegistroVenta()">Registrar Venta</button>
      <img src="recibo_pro.png" alt="Registrar venta" class="vta-img">
    </div>

    <!-- Modificar venta -->
    <div class="vta-card">
      <button class="vta-btn vta-btn-yellow" onclick="VeraModificar()">Modificar Venta</button>
      <img src="documento.png" alt="Modificar venta" class="vta-img">
    </div>

    <!-- Ver ventas -->
    <div class="vta-card">
      <button class="vta-btn vta-btn-green" onclick="VerVentas()">Ventas</button>
      <img src="dinero.png" alt="Ver ventas" class="vta-img">
    </div>

    <!-- Eliminar venta -->
    <div class="vta-card">
      <button class="vta-btn vta-btn-yellow" onclick="EliminarVenta()">Eliminar Venta</button>
      <img src="papelera.png" alt="Eliminar venta" class="vta-img">
    </div>

  </div>
</div>
