<img src="naranja.png" alt="Naranja" class="fruta fruta-naranja">
<img src="manzana.png" alt="Manzana" class="fruta fruta-manzana">
<img src="aguacatepro.png" alt="Aguacate" class="fruta fruta-aguacate">
<img src="arandanos.png" alt="Arándanos" class="fruta fruta-arandanos">

<!-- Título Superior Centrado -->
<div class="header-titulo-seccion">
    <h2 class="titulo-reporte">Reportes y Gráficas</h2>
</div>
<!-- Panel de Gráficas y Métricas -->
<div class="contenedor-edicion">
    <!-- Panel Izquierdo: Gráfica -->
    <div class="panel-edicion">
        <div class="panel-cabecera">
            <h3 class="panel-titulo">Gráfica del...</h3>
            <select class="combo-filtro">
                <option value="">Selecciona una opción</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>
        <div class="area-grafica">
            <!-- Canvas o contenedor donde se renderiza la gráfica -->
             <canvas id="miGrafica"></canvas>
            </div>
        </div>
        <!-- Panel Derecho: Información/Resumen -->
        <div class="panel-edicion">
            <h3 class="panel-titulo">Información del ---</h3>
            <div class="lista-metricas">

            </div>
            <!-- Ninguna tiene la clase 'activa' -->
            <div class="tarjeta-metrica" onclick="seleccionarMetrica(this, 'ventas')">
                <div class="icono-metrica"><span class="emoji-icono">💰</span></div>
                <div class="info-metrica"><span class="lbl-metrica">Total de ventas</span></div>
            </div>
            <div class="tarjeta-metrica" onclick="seleccionarMetrica(this, 'transacciones')">
                <div class="icono-metrica"><span class="emoji-icono">🧾</span></div>
                <div class="info-metrica"><span class="lbl-metrica">Total de Transacciones</span></div>
            </div>
            <div class="tarjeta-metrica" onclick="seleccionarMetrica(this, 'productos')">
                <div class="icono-metrica"><span class="emoji-icono">📦</span></div>
                <div class="info-metrica"><span class="lbl-metrica">Total de Productos</span></div>
            </div>
        </div>
    </div>
</div>
