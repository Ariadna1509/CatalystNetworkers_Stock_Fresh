<link rel="stylesheet" href="css.css">
<link rel="stylesheet" href="styleInicioSesionV2.css">

<body>
            <img src="naranja.png" alt="Naranja" class="fruta fruta-naranja">
            <img src="manzana.png" alt="Manzana" class="fruta fruta-manzana">
            <img src="aguacatepro.png" alt="Aguacate" class="fruta fruta-aguacate">
            <img src="arandanos.png" alt="Arándanos" class="fruta fruta-arandanos">

    <div class="login-figuritas">

        <div class="stage">

            <div class="figure_1 sandia">
            <div class="bob">
                <svg class="body" viewBox="0 0 120 66">
                    <path d="M4 4 A56 60 0 0 0 116 4 Z" fill="#4f9a3f"/>
                    <path d="M8 4 A52 56 0 0 0 112 4 Z" fill="#eaf7d9"/>
                    <path d="M13 4 A47 51 0 0 0 107 4 Z" fill="#ef5a4f"/>
                    <g fill="#2a1a1a">
                        <ellipse cx="26" cy="20" rx="2" ry="3.2" transform="rotate(-20 26 20)"/>
                        <ellipse cx="94" cy="20" rx="2" ry="3.2" transform="rotate(20 94 20)"/>
                        <ellipse cx="40" cy="42" rx="2" ry="3.2" transform="rotate(-10 40 42)"/>
                        <ellipse cx="80" cy="42" rx="2" ry="3.2" transform="rotate(10 80 42)"/>
                        <ellipse cx="60" cy="50" rx="2" ry="3.2"/>
                    </g>
                </svg>
                <div class="face">
                    <div class="eyes">
                        <i class="blush l"></i><i class="blush r"></i>
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <div class="figure_1 naranja">
            <div class="bob">
                <svg class="body" viewBox="0 0 100 110">
                    <circle cx="50" cy="60" r="44" fill="#f59a2e"/>
                    <ellipse cx="30" cy="42" rx="8" ry="14" fill="#fff" opacity=".22" transform="rotate(25 30 42)"/>
                    <path d="M50 18 Q48 10 54 3" fill="none" stroke="#7a4b2a" stroke-width="4" stroke-linecap="round"/>
                    <path d="M54 12 C62 0 80 0 90 6 C82 20 64 22 54 12 Z" fill="#5baa3c"/>
                </svg>
                <div class="face">
                    <div class="eyes">
                        <i class="blush l"></i><i class="blush r"></i>
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <div class="figure_1 pera">
            <div class="bob">
                <svg class="body" viewBox="0 0 100 130">
                    <path d="M50 14 C62 14 66 30 66 44 C66 56 88 64 88 92 C88 116 70 126 50 126 C30 126 12 116 12 92 C12 64 34 56 34 44 C34 30 38 14 50 14 Z" fill="#a8cf45"/>
                    <ellipse cx="34" cy="92" rx="7" ry="16" fill="#fff" opacity=".2" transform="rotate(12 34 92)"/>
                    <path d="M50 16 Q50 8 55 2" fill="none" stroke="#7a4b2a" stroke-width="4" stroke-linecap="round"/>
                    <path d="M54 10 C64 0 78 4 82 12 C72 18 60 16 54 10 Z" fill="#4f9a3f"/>
                </svg>
                <div class="face">
                    <div class="eyes">
                        <i class="blush l"></i><i class="blush r"></i>
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <div class="figure_1 manzana">
            <div class="bob">
                <svg class="body" viewBox="0 0 100 100">
                    <path d="M50 24 C36 12 8 22 10 54 C12 82 32 96 44 92 C48 91 52 91 56 92 C68 96 88 82 90 54 C92 22 64 12 50 24 Z" fill="#e6453a"/>
                    <ellipse cx="28" cy="42" rx="6" ry="12" fill="#fff" opacity=".22" transform="rotate(20 28 42)"/>
                    <path d="M50 24 Q47 12 55 5" fill="none" stroke="#7a4b2a" stroke-width="4" stroke-linecap="round"/>
                    <path d="M55 14 C64 4 80 6 85 12 C77 20 63 20 55 14 Z" fill="#5baa3c"/>
                </svg>
                <div class="face">
                    <div class="eyes">
                        <i class="blush l"></i><i class="blush r"></i>
                        <div class="eye"><div class="pupil"></div></div>
                        <div class="eye"><div class="pupil"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        </div>

        <div class="stageII">
        <form id="form" onsubmit="iniciarSesion(event)">
            <h1>Welcome</h1>
            <input type="text" id="idLocatario" placeholder="ID de Locatario" required>
            <div class="field-pass">
                <input type="password" id="inputPassword" placeholder="Contraseña" required>
                <button id="ver" type="button">Ver</button>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        </div>

    </div>
</body>
